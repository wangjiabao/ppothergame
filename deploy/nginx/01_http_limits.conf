# Include this file once inside nginx.conf's http {}, before the vhost include.
# Nginx >= 1.17.6. These are initial limits, not measured server capacity.
# The key uses the path without query arguments.
map $uri $pp_heavy_key {
    default "";
    /api/app_server/user_index_list           "$binary_remote_addr|$uri";
    /api/app_server/user_info                 "$binary_remote_addr|$uri";
    /api/app_server/user_back_list            "$binary_remote_addr|$uri";
    /api/app_server/user_market_rent_land_list "$binary_remote_addr|$uri";
    /api/app_server/user_market_seed_list      "$binary_remote_addr|$uri";
    /api/app_server/user_market_land_list      "$binary_remote_addr|$uri";
    /api/app_server/user_market_prop_list      "$binary_remote_addr|$uri";
}

map $uri $pp_login_key {
    default "";
    /api/app_server/eth_authorize "$binary_remote_addr|$uri";
    /api/admin_dhb/login         "$binary_remote_addr|$uri";
}

limit_req_zone $binary_remote_addr zone=pp_app_ip:10m rate=10r/s;
limit_req_zone $server_name        zone=pp_app_total:1m rate=60r/s;
limit_req_zone $pp_heavy_key       zone=pp_heavy:20m rate=1r/s;
limit_req_zone $pp_login_key       zone=pp_login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=pp_admin_ip:10m rate=5r/s;

limit_conn_zone $binary_remote_addr zone=pp_app_conn_ip:10m;
limit_conn_zone $server_name        zone=pp_app_conn_total:1m;

# No query strings, Authorization headers, or request bodies are logged.
log_format pp_api escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"upstream_status":"$upstream_status","request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"req_limit":"$limit_req_status","conn_limit":"$limit_conn_status"}';

map $status $pp_limitlog {
    default 0;
    429 1;
    403 1;
}
