# Include in the existing www.ppflsc.com server {}.
# Keep the existing listen, SSL certificate, server_name and root directives.
# Remove conflicting old /game/, /adminsystem/ and API locations first.
# Remove old server-level limit_conn, limit_req and limit_rate directives.
# dist contents must be under <existing root>/game and /adminsystem.

location = / {
    return 302 /game/;
}

location = /game {
    return 301 /game/;
}

location ^~ /game/assets/ {
    try_files $uri =404;
    expires 7d;
}

location ^~ /game/audio/ {
    try_files $uri =404;
    expires 7d;
}

location ^~ /game/home/ {
    try_files $uri =404;
    expires 7d;
}

location ^~ /game/ {
    try_files $uri $uri/ /game/index.html;
    expires -1;
}

location = /adminsystem {
    return 301 /adminsystem/;
}

location ^~ /adminsystem/static/ {
    satisfy all;
    include /www/server/nginx/conf/ppflsc-admin-allow.conf;
    try_files $uri =404;
    expires 7d;
}

location ^~ /adminsystem/ {
    satisfy all;
    include /www/server/nginx/conf/ppflsc-admin-allow.conf;
    try_files $uri $uri/ /adminsystem/index.html;
    expires -1;
}

# SetBuyLand settles auctions and bypasses JWT in the current Go backend.
# The same-machine scheduler can call 127.0.0.1:6222 directly.
location = /api/app_server/set_buy_land {
    satisfy all;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:6222;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_cache off;
    proxy_next_upstream off;
    access_log /www/wwwlogs/ppflsc-api.log pp_api buffer=64k flush=1s;
    access_log /www/wwwlogs/ppflsc-limit.log pp_api if=$pp_limitlog;
    error_log /www/wwwlogs/ppflsc-api-error.log warn;
}

location ^~ /api/app_server/ {
    # All public App APIs share these limits, including the heavy endpoints.
    limit_req zone=pp_app_ip burst=20 nodelay;
    limit_req zone=pp_app_total burst=20 nodelay;
    limit_req zone=pp_heavy burst=2 nodelay;
    limit_req zone=pp_login burst=3 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    limit_conn pp_app_conn_ip 20;
    limit_conn pp_app_conn_total 40;
    limit_conn_status 429;
    limit_conn_log_level warn;

    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:6222;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_cache off;
    proxy_next_upstream off;
    add_header Cache-Control "no-store" always;

    access_log /www/wwwlogs/ppflsc-api.log pp_api buffer=64k flush=1s;
    access_log /www/wwwlogs/ppflsc-limit.log pp_api if=$pp_limitlog;
    error_log /www/wwwlogs/ppflsc-api-error.log warn;
}

location ^~ /api/admin_dhb/ {
    satisfy all;
    include /www/server/nginx/conf/ppflsc-admin-allow.conf;
    limit_req zone=pp_admin_ip burst=10 nodelay;
    limit_req zone=pp_login burst=3 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:6220;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    # Existing admin backend timeout is 1800s; preserve long scheduled jobs.
    proxy_read_timeout 1800s;
    proxy_cache off;
    proxy_next_upstream off;
    add_header Cache-Control "no-store" always;

    access_log /www/wwwlogs/ppflsc-api.log pp_api buffer=64k flush=1s;
    access_log /www/wwwlogs/ppflsc-limit.log pp_api if=$pp_limitlog;
    error_log /www/wwwlogs/ppflsc-api-error.log warn;
}
